name: bright_sun_documents_flutter
description: "Bright Sun Documents - Professional Document Writing & Translation Platform"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_database: ^11.3.5
  firebase_storage: ^12.4.5
  http: ^1.4.0
  file_picker: ^10.3.10
  fl_chart: ^0.70.2
  fluttertoast: ^8.2.12
  google_sign_in: ^6.3.0
  provider: ^6.1.5
  go_router: ^15.1.2
  image_picker: ^1.1.2
  syncfusion_flutter_pdf: ^29.2.7
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
